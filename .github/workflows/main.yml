name: Refresh Shop Cache

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest shop data
        run: |
          curl -sf --max-time 30 --retry 3 --retry-delay 5 https://api.redfor.org/shop -o shop-data.json
          echo "Fetched:"
          cat shop-data.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add shop-data.json
          git diff --cached --quiet || git commit -m "Refresh shop data $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push